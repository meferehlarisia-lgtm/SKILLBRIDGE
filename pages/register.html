<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join SkillBridge</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">

                <a href="../index.html" class="logo">
                    Skill<span>Bridge</span>
                </a>

                <h1>
                    Build your future
                    with your skills.
                </h1>

                <p>
                    Create your SkillBridge profile and start
                    connecting with students, projects and opportunities.
                </p>

            </div>


            <div class="auth-card">

                <h2>
                    Create your account
                </h2>

                <p class="auth-subtitle">
                    Start your SkillBridge journey.
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            I am joining as
                        </label>

                        <select id="role" name="role" required>

                            <option value="">
                                Select your role
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="organization">
                                Organization
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="primary-btn auth-submit"
                    >
                        Create Account
                    </button>

                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
